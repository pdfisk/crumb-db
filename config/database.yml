# All database login values come from the DATABASE_URL environment variable:
#   postgres://USER:PASSWORD@HOST:PORT/DBNAME
#
# Heroku: DATABASE_URL is set automatically by the Heroku Postgres add-on.
# Local:  set DATABASE_URL in .env (see .env.example).
# Tests:  use TEST_DATABASE_URL so the test suite never touches your dev/remote data.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { raise "DATABASE_URL is not set (see .env.example)" } %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://admin@localhost:5432/cobol_studio_test") %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { raise "DATABASE_URL is not set" } %>
